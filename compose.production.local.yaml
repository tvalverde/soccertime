services:
  # The development server is not part of this stack. It comes in because the replica is
  # `compose.yaml` plus these overrides, and without this it was started and rebuilt on every
  # `up`: a second Django on port 8000, and the reason two images were being built from one
  # command. A profile nobody enables is how compose says "defined here, not started here" —
  # `compose.yaml` on its own is untouched, since a service only opts out where the profile is
  # declared.
  web:
    profiles:
      - excluded-from-the-replica

  traefik:
    image: traefik:v2.11
    container_name: soccertime-traefik-local
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=soccertime-local
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/certs/tls.yml
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.docker/traefik/certs:/etc/traefik/certs:ro
    networks: !override
      - soccertime-local
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-local.rule=Host(`traefik.mojon.local`)
      - traefik.http.routers.traefik-local.entrypoints=web
      - traefik.http.routers.traefik-local.service=api@internal

  soccertime-web:
    # Its own tag, because bringing this stack up builds `web` and `soccertime-web` in the
    # same command with opposite values of `INSTALL_DEV`. Sharing `soccertime:latest` made
    # the winner depend on which build finished last: one way the development container came
    # up without pytest and `make test` died with `executable file not found`, which reads as
    # a broken environment rather than a tag collision; the other way this stack silently ran
    # an image carrying the toolchain, so the rehearsal stopped rehearsing production.
    image: soccertime:replica
    build:
      context: .
      # Pinned rather than inherited: this is what makes the image a production one.
      args:
        INSTALL_DEV: "false"
    env_file:
      - .env.production.local
    networks: !override
      - soccertime-local
    labels:
      - "traefik.http.routers.soccertime-app.tls.certresolver="
      - "traefik.docker.network=soccertime-local"
    volumes: !override
      - ./media:/code/media:rw
      - ./static:/code/static:rw
      - soccertime-db:/code/db:rw
    user: "${DOCKER_UID}:${DOCKER_GID}"

  soccertime-nginx:
    env_file:
      - .env.production.local
    networks: !override
      - soccertime-local
    labels:
      - "traefik.docker.network=soccertime-local"
    volumes: !override
      - ./media:/usr/share/nginx/html/media:ro
      - ./static:/usr/share/nginx/html/static:ro
    user: "${DOCKER_UID}:${DOCKER_GID}"

networks:
  soccertime-local:
    name: soccertime-local
    driver: bridge
  nassut-net:
    name: nassut-net
    driver: bridge
