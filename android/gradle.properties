org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX, and only AndroidX. The support library is retired and Jetifier rewrites
# dependencies that nothing here has.
android.useAndroidX=true

kotlin.code.style=official

# Each module compiles only the R fields it uses rather than every one in the tree.
android.nonTransitiveRClass=true
