[project]
name = "soccertime"
version = "0.2.0"
description = "Sports events aggregator"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "soccertime.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["soccertime/tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "integration: marks tests as integration tests (may make real HTTP requests)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:DateTimeField ChannelLink.date_added received a naive datetime:RuntimeWarning",
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
exclude = ["soccertime/migrations/", "soccertime/tests/"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Ships no type information of its own.
module = ["adminsortable2.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "soccertime.settings"

[tool.coverage.run]
source = ["soccertime"]
omit = [
    "soccertime/tests/*",
    "soccertime/migrations/*",
    "soccertime/management/commands/scraping/example.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
]
ignore = [
    "E501",   # line too long (handled by formatter)
    # Requiring annotations is the point; forbidding `Any` in them is not achievable
    # here without lying. The admin display callables genuinely receive any model,
    # since AutoModelAdmin reuses them across all of them, and `*args`/`**kwargs` on
    # save() and the signal receivers follow signatures Django dictates.
    "ANN401",  # any-type
]

[tool.ruff.lint.per-file-ignores]
# Test functions are almost all fixtures and `-> None`; annotating them adds diameter
# without telling a caller anything. Migrations are generated.
"soccertime/tests/*" = ["ANN"]
"soccertime/migrations/*" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["soccertime"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

