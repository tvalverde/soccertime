version: 2

# Everything this repository pins, and nothing it does not: pinning is what makes a build
# reproducible and it is also what makes it stale, so each kind of manifest gets something
# that proposes the update. `test_dependency_updates.py` derives that list from the files
# actually here, so a new kind of manifest cannot arrive unwatched.
updates:
  # Reads both requirements.txt and requirements-dev.txt from the root.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly

    # Django stops at 6.0 here, and not by preference. `django-admin-sortable2` swaps the
    # admin's own `actions.js` for a copy named after the running Django, and 2.3.1 — the
    # latest release, from January 2026 — ships `actions-{4.2,5.0,5.1,5.2,6.0}.js` and nothing
    # for 6.1. Under `ManifestStaticFilesStorage` a missing static file raises rather than
    # 404s, so the sortable changelists answer 500 while every other admin page is fine. That
    # is measured rather than feared: it is what failed CI on the 6.1 pull request, caught by
    # `test_admin.py::test_the_sortable_admin_has_a_script_for_this_django`.
    #
    # The 6.0 line still comes through — the ignore begins at 6.1 — so the version actually
    # running keeps being offered its patches. Delete this entry when the package catches up;
    # `test_dependency_updates.py` turns red the moment it does, so nobody has to remember.
    ignore:
      - dependency-name: "django"
        versions: [">=6.1"]

  # The actions the workflow pins by major version. Nothing else updates them, and an action
  # left behind stops running at all when its runtime is retired.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # The base image, now that it names a minor version instead of following a floating tag.
  # That pin is what stops the interpreter changing under the site by itself; this is what
  # stops it staying on an unpatched one forever.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

    # Python stops at 3.14 here because Django does: 6.0 — the line held above — declares
    # 3.12 to 3.14, and 3.15 is first declared by 6.1. Running production on an interpreter
    # the framework does not claim to support is the kind of change a weekly pull request
    # should not make in passing. 3.14 patches still come through; the ignore begins at 3.15.
    # `test_dependency_updates.py` turns red when the pinned Django declares 3.15, so this
    # entry is removed when it stops being true rather than when somebody remembers.
    ignore:
      - dependency-name: "python"
        versions: [">=3.15"]
