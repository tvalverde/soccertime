services:
  soccertime-nginx:
    container_name: soccertime-nginx
    image: nginxinc/nginx-unprivileged:alpine
    env_file:
      - .env.production
    depends_on:
      soccertime-web:
        condition: service_healthy
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=10M,mode=1777
      - /var/cache/nginx:size=10M
      - /var/run:size=1M
    volumes:
      - soccertime-media:/usr/share/nginx/html/media:ro
      - soccertime-static:/usr/share/nginx/html/static:ro
    restart: unless-stopped
    user: 1000:1000
    networks:
      - nassut-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.soccertime-nginx.rule=${TRAEFIK_HOST_RULE} && (PathPrefix(`/soccertime/static`) || PathPrefix(`/soccertime/media`))"
      - "traefik.http.routers.soccertime-nginx.priority=2000"
      - "traefik.http.routers.soccertime-nginx.entrypoints=websecure"
      - "traefik.http.routers.soccertime-nginx.tls=true"
      - "traefik.http.routers.soccertime-nginx.middlewares=soccertime-nginx-strip-prefix"
      - "traefik.http.middlewares.soccertime-nginx-strip-prefix.stripprefix.prefixes=/soccertime"
      - "traefik.http.services.soccertime-nginx.loadbalancer.server.port=8080"

  soccertime-web:
    # No `container_name`: it forbids running two at once, and a deploy needs exactly that —
    # the new container has to be serving before the old one goes, or Traefik spends a second
    # answering 502 and then four answering 404 because no route matches at all. Anything that
    # needs the running container asks compose for its id rather than assuming the name.
    build:
      context: .
    image: soccertime:latest
    # This image is built on the host and published nowhere, so `docker compose pull` asked a
    # registry for it and got `pull access denied for soccertime, repository does not exist`,
    # failing the whole command and taking the four images that really are remote with it.
    # `never` says what is true: there is nothing to fetch. Deliberately not `build`, which
    # also silences the pull but makes every `up` rebuild — that would put a build, and a
    # `docker/dockerfile:1` download, inside the container hand-over of a deploy.
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # read_only: true
    tmpfs:
      - /tmp:size=50M,mode=1777
      - /var/tmp/soccertime_cache:size=50M,mode=1777
    command: python -m uvicorn soccertime.asgi:application --host 0.0.0.0 --port 8000 --root-path /soccertime
    volumes:
      - soccertime-db:/code/db:rw
      - soccertime-media:/code/media:rw
      - soccertime-static:/code/static:rw
      - /home/toni/shared:/shared:ro
    env_file:
      - .env.production
    user: 1000:1000
    networks:
      - nassut-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.soccertime-app.rule=${TRAEFIK_HOST_RULE} && PathPrefix(`/soccertime`)"
      - "traefik.http.routers.soccertime-app.priority=1000"
      - "traefik.http.routers.soccertime-app.entrypoints=websecure"
      - "traefik.http.routers.soccertime-app.tls=true"
      - "traefik.http.routers.soccertime-app.tls.certresolver=resolver-http"
      - "traefik.http.routers.soccertime-app.middlewares=soccertime-app-strip-prefix"
      - "traefik.http.middlewares.soccertime-app-strip-prefix.stripprefix.prefixes=/soccertime"
      # The admin gets its own router purely so a rate limit can be attached to it and to
      # nothing else. It needs a higher priority than the application router, which would
      # otherwise match `/soccertime/admin` first on the strength of its shorter prefix.
      # The limit is generous for a person clicking through the admin and mean for anything
      # working through a password list, and it is charged per source address: Traefik
      # terminates TLS itself here, with no CDN in front, so the address it sees is the
      # client's and needs no `ipStrategy.depth`. Rejection happens in the proxy, which is
      # the point — a refused attempt costs no worker and no write to the SQLite file that
      # is also serving the site.
      - "traefik.http.routers.soccertime-admin.rule=${TRAEFIK_HOST_RULE} && PathPrefix(`/soccertime/admin`)"
      - "traefik.http.routers.soccertime-admin.priority=1500"
      - "traefik.http.routers.soccertime-admin.entrypoints=websecure"
      - "traefik.http.routers.soccertime-admin.tls=true"
      - "traefik.http.routers.soccertime-admin.middlewares=soccertime-admin-rate-limit,soccertime-app-strip-prefix"
      - "traefik.http.routers.soccertime-admin.service=soccertime-app-service"
      - "traefik.http.middlewares.soccertime-admin-rate-limit.ratelimit.average=30"
      - "traefik.http.middlewares.soccertime-admin-rate-limit.ratelimit.period=1m"
      - "traefik.http.middlewares.soccertime-admin-rate-limit.ratelimit.burst=15"
      # Marking a favourite is the only write this site accepts without a login, so it gets
      # the same treatment on a router of its own. The prefix is `/soccertime/favorite/` and
      # not `/soccertime/favorites/`, which is the landing page and must stay unthrottled —
      # the two names differ by one letter on purpose, and that is why the endpoints do not
      # live under the page. Generous for a person pressing stars and mean for anything
      # hammering the endpoint to churn the page cache.
      - "traefik.http.routers.soccertime-favorite.rule=${TRAEFIK_HOST_RULE} && PathPrefix(`/soccertime/favorite/toggle`)"
      - "traefik.http.routers.soccertime-favorite.priority=1400"
      - "traefik.http.routers.soccertime-favorite.entrypoints=websecure"
      - "traefik.http.routers.soccertime-favorite.tls=true"
      - "traefik.http.routers.soccertime-favorite.middlewares=soccertime-favorite-rate-limit,soccertime-app-strip-prefix"
      - "traefik.http.routers.soccertime-favorite.service=soccertime-app-service"
      - "traefik.http.middlewares.soccertime-favorite-rate-limit.ratelimit.average=60"
      - "traefik.http.middlewares.soccertime-favorite-rate-limit.ratelimit.period=1m"
      - "traefik.http.middlewares.soccertime-favorite-rate-limit.ratelimit.burst=20"
      - "traefik.http.services.soccertime-app-service.loadbalancer.server.port=8000"
      # Traefik routes to a container the moment it starts, without waiting for the process
      # inside to listen — so a deploy that overlaps two containers would send half its
      # requests into a socket nobody is accepting on yet. This makes Traefik ask before it
      # sends. `hostname` is not optional: the probe otherwise carries the container's IP as
      # `Host`, Django rejects it through ALLOWED_HOSTS, every server is marked down and the
      # whole service answers 503 — measured, not imagined. `/healthz/` is reached directly,
      # without the prefix the router strips.
      - "traefik.http.services.soccertime-app-service.loadbalancer.healthcheck.path=/healthz/"
      - "traefik.http.services.soccertime-app-service.loadbalancer.healthcheck.hostname=www.mojon.es"
      - "traefik.http.services.soccertime-app-service.loadbalancer.healthcheck.interval=1s"
      - "traefik.http.services.soccertime-app-service.loadbalancer.healthcheck.timeout=1s"
      - "traefik.http.routers.soccertime-app.service=soccertime-app-service"

volumes:
  soccertime-media:
  soccertime-static:
  soccertime-db:
